[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cdse-local-mcp"
version = "0.1.0.dev0"
description = "MCP server for the Copernicus Data Space Ecosystem: catalogue discovery and product download"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Kostas Vlachos" }]
keywords = [
    "mcp",
    "model-context-protocol",
    "copernicus",
    "sentinel",
    "earth-observation",
    "stac",
    "geospatial",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
]
dependencies = [
    "fastmcp>=4.0,<5",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "shapely>=2.0",
    # Downloads are the point of this server, so these are not optional. As an extra they
    # were a trap: a plain `uv sync` uninstalled them from a working environment, leaving a
    # server that started, searched, and failed every download.
    "boto3>=1.34",  # S3 listing and request signing
    "rasterio>=1.3",  # windowed extraction; its wheels bundle GDAL with JPEG 2000 support
]

[project.urls]
Homepage = "https://github.com/konstantinos2018/cdse-local-mcp"
Repository = "https://github.com/konstantinos2018/cdse-local-mcp"
Issues = "https://github.com/konstantinos2018/cdse-local-mcp/issues"

[project.scripts]
cdse-local-mcp = "cdse_local_mcp.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.hatch.build.targets.wheel]
packages = ["src/cdse_local_mcp"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # bugbear
    "SIM",  # simplify
    "RUF",  # ruff-specific
    "T20",  # flake8-print: stdout is the MCP channel, never print
    "ASYNC",
]

[tool.ruff.lint.per-file-ignores]
# Tests legitimately print, poll for background jobs, and read files from async bodies.
# These rules guard the event loop in the server, where they stay enforced.
"tests/*" = ["T20", "ASYNC109", "ASYNC110", "ASYNC240"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
strict = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["shapely.*", "boto3.*", "botocore.*", "rasterio.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config -m 'not live'"
asyncio_mode = "auto"
markers = [
    "live: hits the real CDSE API; needs credentials and spends quota",
]
