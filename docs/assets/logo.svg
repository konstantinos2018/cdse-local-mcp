<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-labelledby="title">
  <title id="title">Copernicus Data Space MCP</title>
  <!-- A satellite on its orbit, beaming down to one small square of Earth: fetching just the
       area you asked for. A filled tile, so it reads on light and dark backgrounds alike. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B2545"/>
      <stop offset="1" stop-color="#16406E"/>
    </linearGradient>
    <linearGradient id="earth" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#2BB3A3"/>
      <stop offset="1" stop-color="#0F6C82"/>
    </linearGradient>
    <clipPath id="tile">
      <rect width="128" height="128" rx="28"/>
    </clipPath>
  </defs>

  <rect width="128" height="128" rx="28" fill="url(#sky)"/>

  <g clip-path="url(#tile)">
    <!-- Earth's limb, lower left -->
    <circle cx="30" cy="132" r="70" fill="url(#earth)"/>
    <!-- Orbit -->
    <ellipse cx="64" cy="64" rx="50" ry="22" transform="rotate(-28 64 64)"
             fill="none" stroke="#9AD1E8" stroke-width="2.5" stroke-opacity="0.5"/>
    <!-- Downlink from the satellite to the surface -->
    <line x1="80.6" y1="41" x2="64" y2="70.8" stroke="#FFD166" stroke-width="2.5"
          stroke-linecap="round" stroke-dasharray="1 5.5"/>
    <!-- The one square that was asked for -->
    <rect x="53.1" y="72.2" width="13" height="13" rx="2" transform="rotate(-20 59.6 78.7)"
          fill="#FFD166" fill-opacity="0.25" stroke="#FFD166" stroke-width="2.5"/>
  </g>

  <!-- Satellite, sitting on the orbit and aligned with it -->
  <g transform="translate(84.5 34) rotate(-28)">
    <rect x="-20" y="-5.5" width="12" height="11" rx="1.5" fill="#9AD1E8"/>
    <rect x="8" y="-5.5" width="12" height="11" rx="1.5" fill="#9AD1E8"/>
    <line x1="-14" y1="-5.5" x2="-14" y2="5.5" stroke="#16406E" stroke-width="1.2"/>
    <line x1="14" y1="-5.5" x2="14" y2="5.5" stroke="#16406E" stroke-width="1.2"/>
    <rect x="-8" y="-1.5" width="16" height="3" fill="#FFFFFF"/>
    <rect x="-5.5" y="-7.5" width="11" height="15" rx="3" fill="#FFFFFF"/>
  </g>
</svg>
